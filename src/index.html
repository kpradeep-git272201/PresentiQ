<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>PresentiQ - Attendance Analytics</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!--
    Apply the saved light/dark mode before first paint so dark-mode users do not
    get a flash of the light theme while Angular boots. ThemeService keeps this
    key in sync and re-applies the same classes on startup.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('app-theme-mode') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) { }
    })();
  </script>

</head>

<body class="mat-typography">
  <app-root></app-root>
</body>

</html>
