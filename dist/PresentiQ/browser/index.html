  <!--
    Apply the saved theme before first paint so users do not get a flash of
    another theme while Angular boots. ThemeService keeps this key in sync and
    re-applies the classes on startup and across logins/logouts.
  -->
  <script>
    (function () {
      try {
        var rawTheme = localStorage.getItem('presentiq_active_theme');
        var theme = (rawTheme && rawTheme.replace(/['"]+/g, '')) || 'blue';
        document.documentElement.classList.remove('theme-blue', 'theme-green', 'theme-purple', 'theme-orange', 'theme-red', 'theme-teal', 'theme-light');
        document.documentElement.classList.add('theme-' + theme);
        if (theme === 'light') {
          document.documentElement.classList.remove('dark-mode');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) { }
    })();
  </script>
